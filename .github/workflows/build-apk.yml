name: Build APK

on:
  push:
    branches: [ main, master, 'claude/*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platforms;android-33" "build-tools;33.0.2"

      - name: Create Gradle build files
        run: |
          cat > android/build.gradle << 'GRADLE'
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:7.4.2'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          GRADLE

          cat > android/settings.gradle << 'GRADLE'
          include ':app'
          GRADLE

          cat > android/gradle.properties << 'GRADLE'
          android.useAndroidX=true
          org.gradle.jvmargs=-Xmx2048m
          GRADLE

          cat > android/app/build.gradle << 'GRADLE'
          apply plugin: 'com.android.application'
          android {
              compileSdkVersion 33
              namespace 'com.amazonsearch.app'
              defaultConfig {
                  applicationId "com.amazonsearch.app"
                  minSdkVersion 21
                  targetSdkVersion 33
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
                  debug { debuggable true }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          GRADLE

          mkdir -p android/gradle/wrapper
          cat > android/gradle/wrapper/gradle-wrapper.properties << 'PROPS'
          distributionUrl=https\://services.gradle.org/distributions/gradle-7.5.1-bin.zip
          PROPS

      - name: Build debug APK
        run: |
          cd android
          gradle wrapper
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: amazon-search-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
